# ═══════════════════════════════════════════════════════════════════════════
# APERTURE - SwiftLint Configuration
# ═══════════════════════════════════════════════════════════════════════════
# 
# SwiftLint enforces Swift style and conventions.
# Install: brew install swiftlint
# Run: swiftlint lint --config .swiftlint.yml
# 
# ═══════════════════════════════════════════════════════════════════════════


# ─────────────────────────────────────────────────────────────────────────────
# EXCLUDED PATHS
# ─────────────────────────────────────────────────────────────────────────────

excluded:
  - DerivedData
  - .build
  - Pods
  - Carthage
  - Package.swift
  - "*/Generated/*"
  - "**/*.generated.swift"
  - fastlane
  - scripts


# ─────────────────────────────────────────────────────────────────────────────
# DISABLED RULES
# ─────────────────────────────────────────────────────────────────────────────
# Rules that are too strict or don't fit our style

disabled_rules:
  - line_length                    # We allow up to 150 for readability
  - trailing_whitespace            # IDE handles this
  - todo                           # We use TODOs intentionally
  - opening_brace                  # Style preference
  - type_body_length               # Some entities are large by design
  - file_length                    # Course files are large by design
  - function_body_length           # Some complex functions are fine
  - cyclomatic_complexity          # Allow complex logic in some cases
  - nesting                        # Nested types are fine for organization
  - identifier_name                # We use short names intentionally (id, db, etc.)


# ─────────────────────────────────────────────────────────────────────────────
# OPT-IN RULES
# ─────────────────────────────────────────────────────────────────────────────
# Additional rules we want enabled

opt_in_rules:
  - empty_count                    # Prefer .isEmpty over .count == 0
  - empty_string                   # Prefer .isEmpty over == ""
  - first_where                    # Prefer .first(where:) over .filter().first
  - last_where                     # Prefer .last(where:) over .filter().last
  - sorted_first_last              # Prefer .min()/.max() over sorted().first/last
  - contains_over_first_not_nil    # Prefer .contains over .first != nil
  - contains_over_filter_count     # Prefer .contains over .filter().count
  - contains_over_filter_is_empty  # Prefer .contains over .filter().isEmpty
  - flatmap_over_map_reduce        # Prefer .flatMap over .map().reduce()
  - array_init                     # Prefer Array(seq) over seq.map { $0 }
  - closure_end_indentation        # Closure end should align with start
  - closure_spacing                # Closures should have proper spacing
  - collection_alignment           # Multi-line collections should align
  - empty_collection_literal       # Prefer [] over Array()
  - literal_expression_end_indentation
  - modifier_order                 # Consistent modifier ordering
  - multiline_arguments            # Multi-line args should be on new lines
  - multiline_parameters           # Multi-line params should be on new lines
  - operator_usage_whitespace      # Operators should have spacing
  - overridden_super_call          # Super calls in overrides
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init # Prefer .zero over CGPoint(x: 0, y: 0)
  - redundant_nil_coalescing       # Remove ?? nil
  - redundant_type_annotation      # Remove redundant type annotations
  - toggle_bool                    # Prefer .toggle() over = !
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition                 # Avoid yoda conditions (if 5 == x)
  - private_over_fileprivate       # Prefer private when possible
  - force_unwrapping               # Warn on force unwrapping
  - implicitly_unwrapped_optional  # Warn on IUOs


# ─────────────────────────────────────────────────────────────────────────────
# RULE CONFIGURATIONS
# ─────────────────────────────────────────────────────────────────────────────

# Force unwrapping - warn, don't error (we use ! carefully)
force_unwrapping:
  severity: warning

# Force cast - error in most cases
force_cast:
  severity: error

# Force try - error
force_try:
  severity: error

# Implicitly unwrapped optionals - warn
implicitly_unwrapped_optional:
  severity: warning
  mode: all_except_iboutlets

# Large tuples - allow up to 4 elements
large_tuple:
  warning: 4
  error: 5

# Type name length
type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID
    - UI
    - VM
    - AI
    - AR
    - VR
    - DB

# Function parameter count
function_parameter_count:
  warning: 6
  error: 8
  ignores_default_parameters: true

# Vertical whitespace
vertical_whitespace:
  max_empty_lines: 2

# Trailing comma - require in multi-line
trailing_comma:
  mandatory_comma: true

# Colon spacing
colon:
  apply_to_dictionaries: true

# Return arrow whitespace
return_arrow_whitespace: error

# Statement position (else on same line as })
statement_position:
  statement_mode: default

# Control statement
control_statement: error

# Empty parentheses with trailing closure
empty_parentheses_with_trailing_closure: warning

# Legacy constructor
legacy_constructor: error

# Legacy constant
legacy_constant: error

# Redundant discardable let
redundant_discardable_let: warning

# Unused closure parameter
unused_closure_parameter: warning

# Unused enumerated
unused_enumerated: warning

# Void return
void_return: warning

# Syntactic sugar
syntactic_sugar: warning

# Shorthand operator
shorthand_operator: warning

# Private outlet
private_outlet:
  allow_private_set: true

# Private action
private_action: warning


# ─────────────────────────────────────────────────────────────────────────────
# CUSTOM RULES
# ─────────────────────────────────────────────────────────────────────────────

custom_rules:
  
  # No print statements in production
  no_print:
    name: "No Print Statements"
    regex: "\\bprint\\s*\\("
    match_kinds:
      - identifier
    message: "Use Logger instead of print() for production code"
    severity: warning
  
  # No hardcoded colors (use Palette)
  no_hardcoded_colors:
    name: "No Hardcoded Colors"
    regex: 'Color\s*\(\s*red:|Color\s*\(\s*\.sRGB'
    message: "Use Palette colors instead of hardcoded values"
    severity: warning
  
  # Require MARK comments for organization
  mark_comment_spacing:
    name: "MARK Comment Spacing"
    regex: "//\\s*MARK:\\s*-(?!\\s)"
    message: "Add a space after MARK: -"
    severity: warning
  
  # No magic numbers in UI code
  magic_number_ui:
    name: "Magic Numbers in UI"
    regex: '\.frame\([^)]*(?<!\d\.)\b(?:[2-9]\d{2,}|1\d{3,})\b'
    message: "Consider extracting large numbers to named constants"
    severity: warning


# ─────────────────────────────────────────────────────────────────────────────
# REPORTER
# ─────────────────────────────────────────────────────────────────────────────

reporter: "xcode"  # Integrates with Xcode build results


# ─────────────────────────────────────════════════════════════════════════════
# ANALYZER RULES (Requires --analyze flag)
# ─────────────────────────────════════════════════════════════════════════════

analyzer_rules:
  - unused_import
  - unused_declaration
