# =============================================================================
#  Google / modern iOS team style – 2026 edition
#  Aggressive but reasonable – favors clarity & consistency
# =============================================================================

excluded:
  - Pods
  - build
  - DerivedData
  - fastlane
  - Carthage
  - vendor

# ─── Severity ───────────────────────────────────────────────────────────────────
strict: true
force_try: warning

# ─── Opt-in rules (enable the most useful ones) ─────────────────────────────────
opt_in_rules:
  - anyobject_protocol
  - array_init
  - closure_body_length
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_range_nil_comparison
  - convenience_type
  - discarded_notification_center_observer
  - discouraged_object_literal
  - empty_collection_literal
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fallthrough
  - file_length
  - first_where
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_zero_over_explicit_init
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - static_operator
  - toggle_bool
  - type_contents_order
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# ─── Rules tuning ───────────────────────────────────────────────────────────────
cyclomatic_complexity:
  warning: 12
  error: 20

file_length:
  warning: 700
  error: 1200

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 10

large_tuple:
  warning: 3
  error: 5

line_length:
  warning: 140
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_interpolated_strings: true

nesting:
  type_level: 3
  function_level: 5

type_body_length:
  warning: 300
  error: 500

vertical_whitespace:
  warning: 2
  error: 4

vertical_whitespace_opening_braces:
  warning: 1

vertical_whitespace_closing_braces:
  warning: 1

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 45
    error: 60
  excluded: [id, URL, x, y, z, i, j, k]

type_name:
  min_length: 3
  max_length: 50

trailing_whitespace:
  ignores_empty_lines: true
  ignores_comment_lines: true

# ─── Discourage force unwrap / force cast ──────────────────────────────────────
force_cast: error
force_try: error
implicitly_unwrapped_optional: warning

# ─── Prefer let over var ────────────────────────────────────────────────────────
prefer_let: warning

# ─── Discourage print / debugPrint in production code ──────────────────────────
discouraged_directive:
  severity: warning
  strings:
    - print
    - debugPrint
    - NSLog

# ─── Encourage using #colorLiteral / #imageLiteral ─────────────────────────────
discouraged_object_literal:
  severity: warning
  objects:
    - color
    - image

# ─── Prefer final over internal/private in types ───────────────────────────────
final_class: warning
final_deinit: warning
final_override: warning

# ─── Enforce consistent access control ─────────────────────────────────────────
private_over_fileprivate: warning

redundant_void_return: warning
redundant_optional_initialization: warning
redundant_nil_coalescing: warning

# ─── Very strict naming ─────────────────────────────────────────────────────────
prohibited_super_calls:
  - viewDidLoad
  - viewWillAppear
  - viewDidAppear
  - viewWillDisappear
  - viewDidDisappear
